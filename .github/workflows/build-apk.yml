# يبني ملف APK تلقائياً عند كل رفع إلى GitHub، أو يدوياً من تبويب Actions ← Build Android APK ← Run workflow.
# الملفات الناتجة في صفحة التشغيل ← Artifacts ← bosla-student-apk
name: Build Android APK

on:
  push:
    branches: [main, master]
    # تعديلات iOS وحدها لا تحتاج بناء نسخة أندرويد جديدة
    paths-ignore:
      - 'ios/**'
      - '.github/workflows/ios-scaffold.yml'
      - '.github/workflows/build-ios.yml'
      - '.github/workflows/test-ios.yml'
      - '.github/workflows/store-assets.yml'
      - 'docs/**'
      - 'integration_test/**'
      - 'test_driver/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # إصدار Flutter مثبّت ليطابق إصدارات Gradle/AGP/Kotlin في مجلد android
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages
        run: flutter pub get

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Unit tests
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        id: release
        run: flutter build apk --release
        continue-on-error: true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bosla-student-apk
          if-no-files-found: warn
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk

      # يفحص سلامة الـ APK وتوقيعه قبل النشر (يطبع النتائج في سجل البناء)
      - name: Verify APK
        if: steps.release.outcome == 'success'
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          ls -la build/app/outputs/flutter-apk/
          sha256sum "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -i -E "^package|sdkVersion|native-code|application-label:" || true
          "$BT/zipalign" -c -P 16 4 "$APK" && echo "zipalign OK" || echo "zipalign FAILED"
          unzip -l "$APK" | grep -E "META-INF|lib/" | head -20
          "$BT/apksigner" verify --verbose --print-certs "$APK"

      # ينشر نسخة release كملف APK مباشر في صفحة Releases
      # رابط ثابت لآخر نسخة: https://github.com/<owner>/<repo>/releases/latest/download/bosla-student.apk
      - name: Publish APK to Releases
        if: github.event_name != 'pull_request' && steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk bosla-student.apk
          gh release create "build-${{ github.run_number }}" bosla-student.apk \
            --target "$GITHUB_SHA" \
            --title "بوصلة الطالب — بناء ${{ github.run_number }}" \
            --notes "$(flutter --version | head -1) — commit ${GITHUB_SHA::7}" \
            --latest

      # اختبار تثبيت وتشغيل فعلي على محاكي Android 12 — يطبع سبب الفشل الحقيقي إن وُجد
      - name: Enable KVM
        if: steps.release.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install test on Android 12 emulator
        if: steps.release.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk || (adb logcat -d | grep -i -E "PackageManager|PackageInstaller|INSTALL_|apk" | tail -60; exit 1)
            adb shell pm list packages | grep bosla
            adb shell monkey -p com.bosla2026.app -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.bosla2026.app && echo APP_RUNNING || echo APP_NOT_RUNNING
            adb logcat -d -s AndroidRuntime:E flutter:V | tail -40
