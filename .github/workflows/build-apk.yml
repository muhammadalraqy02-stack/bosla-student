# يبني ملف APK تلقائياً عند كل رفع إلى GitHub، أو يدوياً من تبويب Actions ← Build Android APK ← Run workflow.
# الملفات الناتجة في صفحة التشغيل ← Artifacts ← bosla-student-apk
name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # إصدار Flutter مثبّت ليطابق إصدارات Gradle/AGP/Kotlin في مجلد android
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages
        run: flutter pub get

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Unit tests
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        id: release
        run: flutter build apk --release
        continue-on-error: true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bosla-student-apk
          if-no-files-found: warn
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
